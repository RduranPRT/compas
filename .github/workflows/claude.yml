name: Claude

# Responde cuando alguien con permiso de escritura menciona @claude en un COMENTARIO
# de issue o pull request, o en una revisión. Crear un issue no dispara a Claude. Ejemplos:
#   @claude /planificar 003
#   @claude /implementar 003
#   @claude /ajustar las compras en dólares quedaron en cero
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Herramientas para pruebas de base de datos
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(./db/run_tests.sh:*),Bash(pnpm:*),Bash(npx:*),Bash(git:*),Bash(psql:*),Edit,Write,Read,Glob,Grep"
